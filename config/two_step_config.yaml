defaults:
  - modalities: default
  - optimizer: adam
  - _self_

data:
  source_file: "/mnt/data/erbauer/retargeting/retargeted_data_v5_faiveonly.npy"
  train_split: 0.8  # 80% for training, 20% for testing
  test_episode: false

model:
  embedding_dim: 32
  modalities: ${modalities}
  contrastive_loss_weight: 1.0  # Scaling parameter for contrastive loss
  encoder_dropout: 0.1  # Dropout rate for encoders
  decoder_dropout: 0.1  # Dropout rate for decoders

training:
  batch_size: 12000
  encoder_epochs: 200  # Number of epochs for encoder training
  decoder_epochs: 50  # Number of epochs for decoder training
  log_interval: 10
  debug: false
  save_interval: 10
  save_path: "checkpoints_two_step"  # This will be resolved to an absolute path in the code
  gpu_id: 0

wandb:
  project: "robot-clip-two-step"
  entity: "erikbauer"

optimizer:
  encoder:
    name: "Adam"
    lr: 0.001
    weight_decay: 0.0001
  decoder:
    name: "Adam"
    lr: 0.001
    weight_decay: 0.0001

temperature:
  initial: 0.3
  final: 0.05
  # Different schedule options: 'linear', 'exponential', 'cosine'
  schedule: 'exponential'
  # Only apply annealing during encoder training
  start_epoch: 0  # When to start annealing
  end_epoch: 120  # When to reach final temperature
