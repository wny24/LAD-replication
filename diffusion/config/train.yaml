hydra:
  job:
    chdir: false
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

clip:
  # Frozen contrastive action model (encoders + decoders). Never updated here.
  checkpoint: ../checkpoints/model_epoch_250.pth

data:
  manifest: data/manifest.yaml

horizon: 16
wrist_dim: 9   # xyz + 6D rotation; set 0 to diffuse CLIP latent only

obs:
  use_image: true
  n_obs_steps: 2
  n_cameras: 1
  image_size: 84
  lowdim_dim: 0   # set >0 if episodes include lowdim_obs (T, D)

unet:
  down_dims: [256, 512, 1024]
  diffusion_step_embed_dim: 256
  kernel_size: 5
  n_groups: 8

scheduler:
  num_train_timesteps: 100
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: squaredcos_cap_v2
  clip_sample: true
  prediction_type: epsilon

optimizer:
  lr: 0.0001
  weight_decay: 0.0001

training:
  steps: 90000
  batch_size: 256
  num_workers: 4
  gpu_id: 0
  device: cuda
  log_interval: 100
  save_interval: 5000
  save_path: checkpoints
  grad_clip: 1.0
  ema_decay: 0.999
  normalizer_samples: 4096
